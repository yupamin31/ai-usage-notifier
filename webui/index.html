<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08090d" />
    <title>AI Usage Control</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MAC MINI · LIVE MONITOR</p>
          <h1>AI Usage Control</h1>
        </div>
        <div class="topbar-actions">
          <button id="refresh-button" class="quiet-button" type="button">
            <span class="refresh-icon" aria-hidden="true">↻</span> 今すぐ更新
          </button>
          <div class="live-pill"><span></span>監視中</div>
        </div>
      </header>

      <section class="hero" aria-labelledby="usage-title">
        <div>
          <p class="section-label">CAPACITY &amp; NOTIFICATIONS</p>
          <h2 id="usage-title">Claude と Codex を個別に管理</h2>
          <p class="hero-copy">残り使用量と通知条件を、サービスごとに確認・設定できます。</p>
        </div>
        <div class="status-summary">
          <div><span>自動更新</span><strong id="refresh-interval">確認中</strong></div>
          <div><span>Discord</span><strong id="discord-status">確認中</strong></div>
          <p id="updated-at" class="updated-at">データを取得しています…</p>
        </div>
      </section>

      <section id="provider-grid" class="provider-grid" aria-live="polite">
        <article class="provider-card skeleton-card provider-claude">
          <div class="provider-heading">
            <span class="provider-mark claude">C</span>
            <div>
              <p>ANTHROPIC</p>
              <h3>Claude</h3>
            </div>
          </div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </article>
        <article class="provider-card skeleton-card provider-codex">
          <div class="provider-heading">
            <span class="provider-mark codex">O</span>
            <div>
              <p>OPENAI</p>
              <h3>Codex</h3>
            </div>
          </div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </article>
      </section>

      <footer>
        <span>Local dashboard</span>
        <span>Claude + Codex Usage Monitor</span>
      </footer>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
